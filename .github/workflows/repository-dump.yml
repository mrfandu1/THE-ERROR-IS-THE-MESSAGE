name: Save repository history and media

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Repository to save (owner/name). Leave blank for this repository.'
        required: false
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: repository-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARCHIVE_BRANCH: repository-archive
      SOURCE_REPOSITORY: ${{ inputs.source_repository || vars.REPOSITORY_DUMP_SOURCE || github.repository }}
    steps:
      - name: Get the export tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Test the export tool
        run: python3 -m unittest discover -s tests -v

      - name: Prepare archive branch
        shell: bash
        run: |
          archive_path="$RUNNER_TEMP/repository-archive"
          if git ls-remote --exit-code --heads origin "$ARCHIVE_BRANCH" >/dev/null; then
            git fetch origin "$ARCHIVE_BRANCH"
            git worktree add --detach "$archive_path" FETCH_HEAD
          else
            git worktree add --detach "$archive_path" HEAD
            git -C "$archive_path" switch --orphan archive-root
          fi
          echo "ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"

      - name: Save conversations and files
        id: export
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/repository_dump.py --repo "$SOURCE_REPOSITORY" --output "$ARCHIVE_PATH/archive"

      - name: Verify saved files
        run: python3 tools/repository_dump.py --verify "$ARCHIVE_PATH/archive"

      - name: Commit the archive back into this repository
        id: publish
        shell: bash
        run: |
          git -C "$ARCHIVE_PATH" config user.name 'github-actions[bot]'
          git -C "$ARCHIVE_PATH" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tools/publish_archive.py "$ARCHIVE_PATH"

      - name: Show export result
        if: always()
        env:
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from tools.repository_dump import read_json
          path = Path(os.environ.get('ARCHIVE_PATH', '')) / 'archive/report.json'
          if not path.is_file():
              raise SystemExit('No export report was produced; inspect the failed step above.')
          report = read_json(path)
          archive_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/tree/repository-archive/archive"
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('# Repository export\n\n')
              summary.write(('Complete' if report['complete'] and os.environ['PUBLISH_OUTCOME'] == 'success' else 'INCOMPLETE') + '\n\n')
              summary.write(f'[Open the saved archive]({archive_url})\n\n')
              for name, count in report.get('counts', {}).items():
                  summary.write(f'- {name.replace("_", " ")}: {count}\n')
              summary.write('\nMissing downloads and API failures are recorded in `archive/report.json`.\n')
          if not report['complete'] or os.environ['EXPORT_OUTCOME'] != 'success' or os.environ['PUBLISH_OUTCOME'] != 'success':
              raise SystemExit('Export incomplete; saved available data and failure report. Rerun to retry.')
          PY
